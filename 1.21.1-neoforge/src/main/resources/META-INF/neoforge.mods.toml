modLoader = "javafml"
loaderVersion = "[0,)"

license = "${mod_license}"
issueTrackerURL = "https://example.com/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''Ponder++ - 机械动力思索增强附属模组。让思索(Ponder)的进度条可以拖动到任意位置，并能在任意位置暂停。'''

[[mixins]]
config="ponderpp.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "ponder"
type = "required"
versionRange = "[0.0,)"
ordering = "AFTER"
side = "CLIENT"
